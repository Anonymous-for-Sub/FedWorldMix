[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedvista"
version = "0.2.0"
description = "FedVista and VistaMix: federated VLA learning from diverse visual worlds."
requires-python = ">=3.10"
dependencies = [
  "h5py",
  "imageio",
  "imageio-ffmpeg",
  "numpy",
  "opencv-python-headless",
  "pillow",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["fedsplat", "phaseb", "phaseb.hpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
