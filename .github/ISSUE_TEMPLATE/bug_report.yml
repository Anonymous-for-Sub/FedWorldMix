name: Bug report
description: Report an implementation, configuration or website problem.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and configuration name, or the page section and browser.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and error output
      description: Python and dependency versions, operating system, and relevant logs.
