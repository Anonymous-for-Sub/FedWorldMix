<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 452" role="img" aria-labelledby="overview-svg-title overview-svg-desc" class="" width="1160" height="452"><title id="overview-svg-title">FedVista overview</title><desc id="overview-svg-desc">Real, 2D and valid GS observations pass through a shared VLA with perception LoRA. VistaMix protects the Real-plus-2D base gradient. Clients upload adapter updates for sample-weighted FedAvg, then receive the global adapter.</desc><style>
    .ov-bg{fill:#fff}.ov-scope{fill:#fbfcfd;stroke:#cbd5df;stroke-dasharray:5 5}.ov-stage-frame{fill:#fff;stroke:#cad4df;stroke-width:1.3;transition:stroke .25s}.ov-stage.active .ov-stage-frame{stroke:#b30064;stroke-width:2}.ov-box{fill:#edf4fb;stroke:#b3c9dd;stroke-width:1}.ov-real{fill:#fbeef0;stroke:#dec2ca}.ov-gs{fill:#fff4df;stroke:#dec59a}.ov-mix{fill:#fbf0f6;stroke:#d7b1c4}.ov-server{fill:#eef4f9;stroke:#bacddc}.ov-text{font-family:Arial,Helvetica,sans-serif;fill:#20374b;font-size:14px}.ov-small{font-size:11px;fill:#586c7c}.ov-label{font-size:10px;fill:#596c7d;letter-spacing:1px}.ov-heading{font-size:14px;font-weight:600}.ov-flow{fill:none;stroke:#97aaba;stroke-width:1.5;stroke-linejoin:round}.ov-return{stroke-dasharray:5 5;stroke:#6c87a0}.ov-flow.active{stroke:#b30064;stroke-width:2}.ov-running .ov-flow.active{stroke-dasharray:7 8;animation:ov-travel 1.1s linear infinite}.ov-stage{cursor:pointer}.ov-stage:hover .ov-stage-frame{stroke:#567c9d}@keyframes ov-travel{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.ov-running .ov-flow.active{animation:none;stroke-dasharray:none}}
  </style><defs><marker id="ov-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#7d92a5"></path></marker></defs>
    <rect x="10" y="48" width="866" height="320" rx="12" class="ov-scope"></rect><text x="28" y="32" text-anchor="start" class="ov-text ov-label">CLIENT i · local observations and training</text>
    <g class="ov-stage" data-stage="0"><rect x="28" y="86" width="162" height="66" rx="9" class="ov-stage-frame ov-real"></rect><text x="109" y="113" text-anchor="middle" class="ov-text ov-heading">Real observations</text><text x="109" y="136" text-anchor="middle" class="ov-text ov-small">Original action targets</text><rect x="28" y="175" width="162" height="66" rx="9" class="ov-stage-frame"></rect><text x="109" y="202" text-anchor="middle" class="ov-text ov-heading">2D augmentation</text><text x="109" y="225" text-anchor="middle" class="ov-text ov-small">Appearance variation</text><rect x="28" y="264" width="162" height="80" rx="9" class="ov-stage-frame ov-gs"></rect><text x="109" y="291" text-anchor="middle" class="ov-text ov-heading">GS views</text><text x="109" y="312" text-anchor="middle" class="ov-text ov-small">Coverage + alignment</text><text x="109" y="330" text-anchor="middle" class="ov-text ov-small">Validity gate</text></g>
    <path d="M190 119 H220 V208 H260" class="ov-flow" data-flow="1" marker-end="url(#ov-arrow)"></path><path d="M190 208 H260" class="ov-flow" data-flow="1" marker-end="url(#ov-arrow)"></path><path d="M190 304 H235 V235 H260" class="ov-flow" data-flow="1" marker-end="url(#ov-arrow)"></path>
    <g class="ov-stage" data-stage="1"><rect x="260" y="86" width="230" height="258" rx="9" class="ov-stage-frame"></rect><text x="375" y="110" text-anchor="middle" class="ov-text ov-label">SHARED VLA</text><rect x="280" y="135" width="190" height="67" rx="9" class="ov-box"></rect><text x="375" y="161" text-anchor="middle" class="ov-text ov-heading">Vision encoder</text><text x="375" y="185" text-anchor="middle" class="ov-text ov-small">+ connector · LoRA</text><rect x="280" y="231" width="190" height="60" rx="9" class="ov-box"></rect><text x="375" y="256" text-anchor="middle" class="ov-text ov-heading">Action expert</text><text x="375" y="277" text-anchor="middle" class="ov-text ov-small">Frozen parameters</text><path d="M375 202 V231" class="ov-flow" data-flow="1" marker-end="url(#ov-arrow)"></path><text x="375" y="322" text-anchor="middle" class="ov-text ov-small">Per-source action losses</text></g>
    <path d="M490 208 H538" class="ov-flow" data-flow="2" marker-end="url(#ov-arrow)"></path>
    <g class="ov-stage" data-stage="2"><rect x="538" y="86" width="304" height="258" rx="9" class="ov-stage-frame"></rect><text x="690" y="110" text-anchor="middle" class="ov-text ov-label">VISTAMIX</text><rect x="560" y="132" width="260" height="56" rx="9" class="ov-box"></rect><text x="690" y="154" text-anchor="middle" class="ov-text ov-small">Base gradient</text><text x="690" y="176" text-anchor="middle" class="ov-text ov-heading">Real + 0.75 × 2D</text><rect x="560" y="214" width="260" height="69" rx="9" class="ov-box ov-gs"></rect><text x="690" y="237" text-anchor="middle" class="ov-text ov-heading">GS correction</text><text x="690" y="258" text-anchor="middle" class="ov-text ov-small">Restrict → project → weight → cap</text><text x="690" y="275" text-anchor="middle" class="ov-text ov-small">0.25 × mean validity × projected GS</text><rect x="575" y="305" width="245" height="27" rx="6" class="ov-box ov-mix"></rect><text x="697" y="324" text-anchor="middle" class="ov-text ov-small">Base + bounded GS correction</text><path d="M560 160 H549 V318 H575" class="ov-flow" data-flow="2" marker-end="url(#ov-arrow)"></path><path d="M697 283 V305" class="ov-flow" data-flow="2" marker-end="url(#ov-arrow)"></path></g>
    <path d="M842 318 H883 V166 H914" class="ov-flow" data-flow="3" marker-end="url(#ov-arrow)"></path><text x="881" y="141" text-anchor="middle" class="ov-text ov-small">Δᵢ, nᵢ</text>
    <g class="ov-stage" data-stage="3"><rect x="914" y="86" width="226" height="258" rx="9" class="ov-stage-frame ov-server"></rect><text x="1027" y="110" text-anchor="middle" class="ov-text ov-label">FEDERATED SERVER</text><rect x="934" y="136" width="186" height="60" rx="9" class="ov-box"></rect><text x="1027" y="160" text-anchor="middle" class="ov-text ov-heading">Client adapter update</text><text x="1027" y="182" text-anchor="middle" class="ov-text ov-small">and sample count</text><rect x="934" y="224" width="186" height="65" rx="9" class="ov-box"></rect><text x="1027" y="250" text-anchor="middle" class="ov-text ov-heading">Sample-weighted</text><text x="1027" y="273" text-anchor="middle" class="ov-text ov-heading">FedAvg</text><path d="M1027 196 V224" class="ov-flow" data-flow="3" marker-end="url(#ov-arrow)"></path><text x="1027" y="322" text-anchor="middle" class="ov-text ov-small">Global adapter</text></g>
    <path d="M1027 344 V407 H375 V344" class="ov-flow ov-return" data-flow="3" marker-end="url(#ov-arrow)"></path><text x="701" y="433" text-anchor="middle" class="ov-text ov-small">Global adapter returned for the next round</text>
  </svg>
